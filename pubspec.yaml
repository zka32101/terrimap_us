name: terrimap_us
description: "State Master – USA (仮)。51州（50州＋DC）の位置・州名・州都を覚える地図クイズ。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.0
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.11.0
  terrimap_core:
    git:
      url: https://github.com/zka32101/terrimap_core
      ref: main
  in_app_review: ^2.0.12
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  share_plus: ^10.1.4
  flutter_timezone: ^3.0.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - packs/us/pack.json
    - packs/us/regions.json
    - packs/us/geo.geojson
    - packs/us/profile.json
    - packs/us/facts.json
    - packs/us/strings/en.json
    - packs/us/strings/zh.json
    - packs/us/strings/ko.json
    - packs/us/strings/tr.json
    - packs/us/strings/nl.json
    - packs/us/strings/pt.json
    - packs/us/strings/it.json
    - packs/us/strings/es.json
    - packs/us/strings/fr.json
    - packs/us/strings/ja.json
    - assets/art/landmarks/
    - assets/sound/
