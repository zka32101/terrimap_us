name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: python3 -I tools/validate_pack.py packs/us
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
